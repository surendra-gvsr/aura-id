[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aura-id-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "supabase>=2.4.0",
    "google-cloud-aiplatform>=1.55.0",
    "pillow>=10.3.0",
    "opencv-python-headless>=4.9.0",
    "mediapipe>=0.10.14",
    "piexif>=1.1.3",
    "stripe>=9.5.0",
    "structlog>=24.1.0",
    "sentry-sdk[fastapi]>=2.3.0",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
    "bcrypt>=4.1.3",
    "apscheduler>=3.10.4",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "PyJWT>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "black>=24.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I"]

[tool.black]
line-length = 100
target-version = ["py311"]
