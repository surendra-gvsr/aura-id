[project]
name = "aura-desktop-agent"
version = "0.1.0"
description = "Aura ID Desktop Agent — types ID scan data into hotel PMS"
requires-python = ">=3.11"
dependencies = [
    "pyautogui>=0.9.54",
    "keyboard>=0.13.5",
    "pystray>=0.19.5",
    "Pillow>=10.4.0",
    "requests>=2.31.0",
    "keyring>=25.0.0",
    "pydantic-settings>=2.2.0",
    "structlog>=24.1.0",
    "sentry-sdk>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "responses>=0.25.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "pyinstaller>=6.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
